<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>รักพี่มล</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;color:#fff3ee;font-family:"Kanit","Noto Sans Thai",system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;background:radial-gradient(120% 90% at 50% 40%,#3d1026 0%,#1d0a16 55%,#0e060c 100%)}
#stage{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#bar{display:none;justify-content:center;padding:6px 16px 20px}
#bar.on{display:flex}
button{font:inherit;font-weight:600;font-size:1.1rem;border:0;border-radius:999px;padding:13px 34px;cursor:pointer;touch-action:manipulation;color:#fff}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#replay,#yes{background:linear-gradient(135deg,#ff8a4c,#ff4d7a);box-shadow:0 6px 26px rgba(255,77,122,.45)}
#replay{padding:10px 26px;font-size:1rem;box-shadow:0 4px 18px rgba(255,77,122,.35)}
#yes{animation:glow 2.2s ease-in-out infinite}
#yes:active,#replay:active{transform:scale(.95)}
@keyframes glow{0%,100%{box-shadow:0 6px 26px rgba(255,77,122,.4)}50%{box-shadow:0 8px 40px rgba(255,120,90,.75)}}
#intro{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:24px;text-align:center}
#intro.gone{display:none}
#intro h1{margin:0;font-size:clamp(2rem,9vw,3.4rem);font-weight:700;line-height:1.3;text-shadow:0 0 28px rgba(255,90,130,.65),0 0 60px rgba(255,120,80,.35);animation:rise .9s ease both,bob 4s ease-in-out .9s infinite}
#intro .row{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;animation:rise .9s .25s ease both}
#no{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,190,205,.4);color:#ffdce4;transition:left .22s ease,top .22s ease;backdrop-filter:blur(4px)}
#ph{display:none}
#taunt{min-height:1.6em;margin:0;color:#ff9fbd;font-size:1rem}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion: reduce){#intro h1,#intro .row,#yes{animation:none}}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="bar"><button id="replay" type="button">กดอีกที</button></div>

<div id="intro">
  <h1>มีอะไรอยากบอก</h1>
  <div class="row">
    <button id="yes" type="button">อยากรู้</button>
    <span id="ph"></span>
    <button id="no" type="button">ไม่อยากรู้</button>
  </div>
  <p id="taunt" aria-live="polite"></p>
</div>

<script>
(function(){
  var WORDS = ["คิดถึง","รักน้าา","พี่มล"];
  var cv = document.getElementById("c"), ctx = cv.getContext("2d");
  var intro = document.getElementById("intro"), yes = document.getElementById("yes"), no = document.getElementById("no");
  var ph = document.getElementById("ph"), taunt = document.getElementById("taunt");
  var bar = document.getElementById("bar"), replay = document.getElementById("replay");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var P = [], BG = [], W = 0, H = 0, dpr = 1, S = 100, CX = 0, CY = 0;
  var clock0 = null, T = 0, startT = 0, started = false;
  var FONT = "Kanit,'Noto Sans Thai',Arial,sans-serif";

  function inside(x,y){var a=x*x+y*y-1;return a*a*a-x*x*y*y*y<=0;}
  function ease(t){t=Math.min(1,Math.max(0,t));return 1-Math.pow(1-t,3);}
  function heartPath(x,y,s){
    y -= s/2;
    ctx.beginPath();
    ctx.moveTo(x,y+s/4);
    ctx.bezierCurveTo(x,y,x-s/2,y,x-s/2,y+s/4);
    ctx.bezierCurveTo(x-s/2,y+s/2,x,y+s*0.75,x,y+s);
    ctx.bezierCurveTo(x,y+s*0.75,x+s/2,y+s/2,x+s/2,y+s/4);
    ctx.bezierCurveTo(x+s/2,y,x,y,x,y+s/4);
    ctx.fill();
  }
  function size(){
    var r = cv.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio||1,2);
    W = r.width; H = r.height;
    cv.width = W*dpr; cv.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    S = Math.min((W-64)/2.5, (H-64)/2.6);
    CX = W/2; CY = H/2 + S*0.05;
  }
  function initBg(){
    BG = [];
    var cols = ["#ff8fb1","#ff7a45","#ffd0dc","#ff5a7a"];
    for (var i=0;i<28;i++) BG.push({x:Math.random()*W, y:Math.random()*(H+60), v:10+Math.random()*18,
      s:5+Math.random()*10, a:0.1+Math.random()*0.22, f:0.4+Math.random()*0.8, ph:Math.random()*6.28,
      c:cols[(Math.random()*cols.length)|0]});
  }
  function build(){
    var fsBase = Math.max(15, S*0.14);
    var top = CY - S*1.2, span = S*2.5;
    P = []; var boxes = [], tries = 0;
    while (tries++ < 8000 && P.length < 90){
      var x = Math.random()*2.6-1.3, y = Math.random()*2.6-1.3;
      if (!inside(x,y)) continue;
      var fs = fsBase*(1+Math.random()*0.25);
      ctx.font = "700 "+fs+"px "+FONT;
      var w = WORDS[(Math.random()*WORDS.length)|0];
      var hx = (ctx.measureText(w).width + fs*0.5)/2, hy = fs*0.65;
      var px = CX+x*S, py = CY-y*S;
      var ok = true, cs = [[-hx,-hy],[hx,-hy],[-hx,hy],[hx,hy]];
      for (var q=0;q<4;q++){ if (!inside((px+cs[q][0]-CX)/S, (CY-(py+cs[q][1]))/S)){ ok=false; break; } }
      if (!ok) continue;
      for (var j=0;j<boxes.length;j++){ var b=boxes[j]; if (Math.abs(px-b.x)<(hx+b.hx) && Math.abs(py-b.y)<(hy+b.hy)){ ok=false; break; } }
      if (!ok) continue;
      boxes.push({x:px,y:py,hx:hx,hy:hy});
      var tt = Math.min(1,Math.max(0,(py-top)/span));
      var ang = Math.random()*Math.PI*2, d = Math.max(W,H)*(0.6+Math.random()*0.5);
      P.push({ w:w, tx:px, ty:py, sx:CX+Math.cos(ang)*d, sy:CY+Math.sin(ang)*d, fs:fs,
        c: Math.random()<0.22 ? "#fff4ee" : "hsl("+(22-tt*38)+",100%,"+(60+Math.random()*8)+"%)",
        d:Math.random()*1.1, ph:Math.random()*6.28, sp:0.6+Math.random()*0.8 });
    }
  }
  function drawBg(){
    var t = reduce ? 0 : T;
    for (var i=0;i<BG.length;i++){
      var p = BG[i], span = H+60;
      var y = ((p.y - t*p.v) % span + span) % span - 30;
      var x = p.x + Math.sin(t*p.f+p.ph)*14;
      ctx.globalAlpha = p.a*(0.7+0.3*Math.sin(t*1.3+p.ph));
      ctx.fillStyle = p.c;
      heartPath(x,y,p.s);
    }
    ctx.globalAlpha = 1;
  }
  function drawFrame(t){
    var m = 18, fw = W-2*m, fh = H-2*m, L = 2*(fw+fh);
    var n = Math.max(12, Math.round(L/34));
    ctx.shadowBlur = 8;
    for (var i=0;i<n;i++){
      var d = i*L/n, x, y;
      if (d < fw){ x = m+d; y = m; }
      else if (d < fw+fh){ x = W-m; y = m+(d-fw); }
      else if (d < 2*fw+fh){ x = W-m-(d-fw-fh); y = H-m; }
      else { x = m; y = H-m-(d-2*fw-fh); }
      var k = reduce ? 1 : ease((t-0.2-i*0.03)/0.6);
      if (k<=0) continue;
      var wave = reduce ? 0.5 : 0.5+0.5*Math.sin(t*3 - i*0.45);
      ctx.globalAlpha = k*(0.5+0.5*wave);
      var c = (i%3===0) ? "#ff9fbd" : (i%3===1 ? "#ff7a45" : "#fff4ee");
      ctx.fillStyle = c; ctx.shadowColor = c;
      heartPath(x,y,(9+5*wave)*k);
    }
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }
  function frame(ts){
    if (clock0===null) clock0 = ts;
    T = (ts-clock0)/1000;
    ctx.clearRect(0,0,W,H);
    drawBg();
    if (started){
      var t = T-startT;
      var b = Math.max(0,Math.sin(t*3.2));
      var beat = reduce ? 1 : 1 + 0.018*b*b;
      // soft glow behind the heart
      var gk = reduce ? 1 : ease((t-0.4)/1.6);
      var g = ctx.createRadialGradient(CX,CY,S*0.1,CX,CY,S*1.7);
      g.addColorStop(0,"rgba(255,70,110,"+(0.30*gk*(0.75+0.25*b))+")");
      g.addColorStop(1,"rgba(255,70,110,0)");
      ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.shadowBlur = 9;
      for (var i=0;i<P.length;i++){
        var p = P[i];
        var k = reduce ? 1 : ease((t-p.d)/1.5);
        var x = p.sx+(p.tx-p.sx)*k, y = p.sy+(p.ty-p.sy)*k;
        if (k>=1 && !reduce){ x += Math.sin(t*p.sp+p.ph)*1.5; y += Math.cos(t*p.sp*0.9+p.ph)*1.5; }
        x = CX+(x-CX)*beat; y = CY+(y-CY)*beat;
        ctx.globalAlpha = Math.min(1,k*1.6);
        ctx.fillStyle = p.c; ctx.shadowColor = p.c;
        ctx.font = "700 "+p.fs+"px "+FONT;
        ctx.fillText(p.w,x,y);
      }
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
      drawFrame(t);
    }
    requestAnimationFrame(frame);
  }
  function start(){
    build(); startT = T; started = true;
  }

  size(); initBg();
  requestAnimationFrame(frame);
  yes.addEventListener("click", function(){
    intro.classList.add("gone"); bar.classList.add("on");
    size(); start();
  });
  replay.addEventListener("click", start);
  window.addEventListener("resize", function(){ size(); initBg(); if (started) build(); });

  // ปุ่ม "ไม่อยากรู้" หนีไปเรื่อยๆ
  var dodges = 0, lines = ["จับไม่ได้หรอก 😝","พลาดแล้ว~","กดอยากรู้เถอะน้า","ไม่ให้กดหรอก","เหนื่อยยัง? กดอยากรู้ได้นะ 💗"];
  function dodge(px, py){
    var r = no.getBoundingClientRect();
    if (no.style.position !== "fixed"){
      ph.style.display = "inline-block";
      ph.style.width = r.width + "px"; ph.style.height = r.height + "px";
      no.style.position = "fixed"; no.style.left = r.left + "px"; no.style.top = r.top + "px";
      no.style.zIndex = 10;
    }
    var vw = window.innerWidth, vh = window.innerHeight;
    var bw = r.width, bh = r.height, m = 10;
    var yr = yes.getBoundingClientRect();
    var best = null;
    for (var i=0;i<30;i++){
      var x = m + Math.random()*(vw-bw-2*m), y = m + Math.random()*(vh-bh-2*m);
      var far = (px==null) ? 1e9 : Math.hypot(x+bw/2-px, y+bh/2-py);
      var hitYes = !(x+bw<yr.left-8 || x>yr.right+8 || y+bh<yr.top-8 || y>yr.bottom+8);
      if (far>140 && !hitYes){ best = [x,y]; break; }
      if (!best) best = [x,y];
    }
    no.style.left = best[0] + "px"; no.style.top = best[1] + "px";
    dodges++;
    taunt.textContent = lines[(dodges-1) % lines.length];
  }
  no.addEventListener("pointerenter", function(e){ dodge(e.clientX, e.clientY); });
  no.addEventListener("pointerdown", function(e){ e.preventDefault(); dodge(e.clientX, e.clientY); });
  no.addEventListener("touchstart", function(e){ e.preventDefault(); var t=e.touches[0]; dodge(t.clientX, t.clientY); }, {passive:false});
  no.addEventListener("focus", function(){ dodge(null,null); no.blur(); });
  no.addEventListener("click", function(e){ e.preventDefault(); dodge(e.clientX, e.clientY); });
})();
</script>
</body>
</html>
